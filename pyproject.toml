[project]
name = "abac-policy-pipeline"
version = "0.3.0"
description = "Formalizing contextual ABAC policies from natural language policy statements (NLPS -> JSON -> UML/USE -> OCL)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
nlp = ["spacy>=3.7,<4", "numpy"]
demo = ["streamlit>=1.35"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
