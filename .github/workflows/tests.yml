name: tests

on:
  push:
  pull_request:

jobs:
  stdlib:
    # Lõi pipeline chỉ cần stdlib: chạy smoke test + pytest ở chế độ regex (không spaCy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python tests/test_smoke.py
      - run: python -m pip install "pytest>=8"
      - run: python -m pytest -q
        env:
          ABAC_DISABLE_SPACY: "1"

  full:
    # spaCy + USE 7.5.0: chạy cả test biên dịch và kiểm thử ngữ nghĩa bằng USE
    runs-on: ubuntu-latest
    env:
      USE_VERSION: "7.5.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements.txt
      - run: python -m spacy download en_core_web_md
      - name: Cài USE
        run: |
          curl -sSL -o use.zip "https://github.com/useocl/use/releases/download/v${USE_VERSION}/use-${USE_VERSION}-use-bin.zip"
          unzip -q use.zip -d "$RUNNER_TEMP"
          echo "ABAC_USE_HOME=$RUNNER_TEMP/use-${USE_VERSION}" >> "$GITHUB_ENV"
      - run: python -m pytest -q --cov=src/abac --cov-report=term-missing
      - run: python run_all.py --input data/vact_en.txt --out out --use-check --semantic-check
